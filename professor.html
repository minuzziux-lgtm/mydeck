calc(94px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1e1f1e;color:#fff;border-radius:999px;padding:12px 22px;font-size:12px;font-weight:600;z-index:60;box-shadow:0 15px 40px #0002;max-width:calc(100vw - 40px);text-align:center}.blankpage{max-width:520px;margin:18vh auto 0;text-align:center}.blankpage h2{font-family:Georgia,serif;font-size:39px;font-weight:400;letter-spacing:-.06em}.blankpage p{font-size:12px;color:#8a8b87;margin-bottom:29px}

/* v2: calm chrome, frosted dock, account menu */
.topbar{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid #f3f2ef}
.top-left{gap:17px}.top-actions{gap:0;position:relative}
.top-back{min-height:44px;display:inline-flex;align-items:center;gap:11px;background:transparent;padding:0 4px;color:#222;font-size:13px;font-weight:600;letter-spacing:-.02em}
.top-back svg{width:17px;height:17px}.top-back:hover{color:#6e6b65}
.shell:has(.study-screen) .study-head>button[data-act="study-back"]{display:none!important}
.shell:has(.study-screen) .study-head{justify-content:flex-end}
.shell:has(.study-screen) .study-head .counter{margin-right:auto}
.shell:has(.editor-header) .content>button[data-act="editor-cancel"],.shell:has(.statstrip) .content>button[data-act="show-classes"]{display:none}
.top-menu-toggle{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:transparent;color:#222;transition:background .16s ease}
.top-menu-toggle:hover,.top-menu-toggle[aria-expanded=true]{background:#f5f5f2}
.top-menu-toggle svg{width:19px;height:19px}
.account-menu{position:absolute;right:0;top:52px;z-index:100;width:min(295px,calc(100vw - 32px));padding:13px;border:1px solid rgba(226,226,223,.8);border-radius:22px;background:rgba(255,255,255,.985);-webkit-backdrop-filter:blur(28px) saturate(1.4);backdrop-filter:blur(28px) saturate(1.4);box-shadow:0 24px 64px rgba(35,32,30,.10),0 4px 16px rgba(35,32,30,.045);animation:menu-reveal .18s cubic-bezier(.2,.8,.25,1)}
@keyframes menu-reveal{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.account-menu[hidden]{display:none!important}
.account-profile{display:grid;gap:4px;padding:10px 11px 14px;border-bottom:1px solid #eeedea;margin-bottom:8px}
.account-profile b{font-size:13px;font-weight:680}.account-profile span{font-size:11px;color:#92928d}
.account-menu-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#999994;padding:11px 10px 7px}
.language-picker{background:#f4f4f1;border-radius:13px;padding:4px;display:flex;gap:4px}
.language-picker button{border-radius:10px;flex:1;min-height:38px;color:#73736e;background:transparent;font-weight:600;font-size:12px}
.language-picker button[aria-pressed=true]{background:#fff;color:#191919;box-shadow:0 1px 4px rgba(0,0,0,.055)}
.account-menu-item{width:100%;min-height:44px;border-radius:11px;padding:0 11px;display:flex;align-items:center;gap:11px;text-align:left;background:transparent;color:#454541;font-size:13px;font-weight:540}
.account-menu-item svg{width:16px;height:16px;opacity:.74}.account-menu-item:hover{background:#f6f6f4}
.account-menu-item.danger{color:#875453}
.account-menu-divider{height:1px;background:#efefeb;margin:8px 0}
/* Base layout grows around the calm floating pill */
@media(max-width:760px){
.topbar{padding:0 22px}.top-role,.top-actions>.avatar{display:none!important}
.bottom-nav{position:fixed!important;left:50%!important;right:auto!important;bottom:calc(13px + env(safe-area-inset-bottom))!important;transform:translateX(-50%);width:min(calc(100% - 28px),440px);display:flex!important;align-items:stretch;justify-content:space-around;gap:2px!important;padding:6px!important;background:rgba(248,248,246,.72)!important;-webkit-backdrop-filter:blur(26px) saturate(1.65)!important;backdrop-filter:blur(26px) saturate(1.65)!important;border:1px solid rgba(255,255,255,.83)!important;border-radius:25px!important;box-shadow:0 12px 35px rgba(28,28,26,.12),0 1px 8px rgba(28,28,26,.04),inset 0 1px 0 rgba(255,255,255,.94)!important;z-index:25}
.bottom-nav button{min-height:53px!important;min-width:0!important;flex:1 1 0;max-width:115px;padding:5px 2px;border-radius:19px!important;gap:5px!important;line-height:1.15;font-size:10px!important;color:#82827f!important;font-weight:550;transition:background .18s,color .18s,transform .18s}
.bottom-nav button.active{background:rgba(255,255,255,.86)!important;box-shadow:0 1px 8px rgba(40,40,40,.06);color:#1b1b1a!important}
.bottom-nav button:active{transform:scale(.975)}
.bottom-nav svg{width:20px!important;height:20px!important}
.content{padding-bottom:calc(135px + env(safe-area-inset-bottom))!important}
.account-menu{top:51px;right:0}
}
@media(min-width:761px){.topbar .desktop-nav{margin-left:20px}.top-menu-toggle{background:#f7f7f5}}
@media(prefers-reduced-motion:reduce){.account-menu,.bottom-nav button{animation:none!important;transition:none!important}}


/* mydeck V3 — refined controls and accessible motion */
:root{--menu-fg:#181918}
.account-menu:not([hidden]){transform-origin:top right;animation:menu-descend .28s cubic-bezier(.16,1,.3,1) both;will-change:transform,opacity,clip-path}
.account-menu.menu-closing{animation:menu-ascend .17s ease-in both;pointer-events:none}
@keyframes menu-descend{from{opacity:0;transform:translateY(-13px) scale(.97);clip-path:inset(0 0 100% 0 round 20px)}to{opacity:1;transform:translateY(0) scale(1);clip-path:inset(0 0 0 0 round 20px)}}
@keyframes menu-ascend{to{opacity:0;transform:translateY(-9px) scale(.98);clip-path:inset(0 0 92% 0 round 20px)}}
.menu-stat{padding:13px 16px;margin:8px 9px;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft)}
.menu-stat strong{font-size:14px;letter-spacing:-.03em}.menu-stat span{color:var(--muted);font-size:12px}
.menu-switchrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 15px;background:transparent;color:var(--ink);font-size:13px;text-align:left}
.menu-switchrow .switch{width:39px;height:23px;border-radius:99px;background:#d3d3ce;padding:3px;flex:none;transition:background .18s ease}
.menu-switchrow .switch i{display:block;background:#fff;width:17px;height:17px;border-radius:50%;transition:transform .18s ease;box-shadow:0 1px 3px #0002}
.menu-switchrow[aria-pressed="true"] .switch{background:#796c9a}.menu-switchrow[aria-pressed="true"] .switch i{transform:translateX(16px)}
.menu-switchrow:hover,.account-menu-item:hover{background:var(--soft)}
.auth-shell{max-width:380px}.auth-body{margin-top:auto;margin-bottom:auto;padding-top:40px}.auth-title{font-family:Georgia,serif;font-size:clamp(28px,7vw,36px);line-height:1.1;letter-spacing:-.048em;max-width:300px}.auth-sub{font-size:13px;line-height:1.55;margin:13px 0 27px;max-width:260px}.auth-actions{gap:9px}.auth-btn{min-height:50px}.auth-note{font-size:10px;line-height:1.45;max-width:280px}
.auth.email-step .auth-body,.auth.code-step .auth-body{margin-top:clamp(62px,15vh,132px);margin-bottom:auto;align-items:stretch;padding-top:0}
.auth.email-step .auth-title,.auth.code-step .auth-title{font-size:30px}
.auth .auth-header{position:relative}.auth-body form{width:100%}
.orbital-center .orbital-label{display:none!important}.student-activity .orbital{margin-bottom:24px!important}.student-activity .activity-count-caption{font-size:12px;color:var(--muted);margin:-4px auto 20px;text-align:center;letter-spacing:.005em}.student-activity h2{margin-top:20px}
/* teacher editor */
.mode-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.mode-picker button{border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--muted);min-height:38px;padding:0 14px;font-size:12px;font-weight:600}.mode-picker button.active{background:var(--ink);color:var(--paper)}
.mode-help{font-size:12px;line-height:1.55;color:var(--muted);margin:10px 0 18px;max-width:65ch}
.media-editor{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;display:grid;gap:11px}.media-editor-head{font-size:12px;font-weight:650;color:var(--ink)}.media-editor-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.media-editor-controls select,.media-editor-controls input[type=file]{max-width:100%;min-height:40px;font-size:12px}.media-editor-controls select{border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 10px}.media-editor .file-hint{color:var(--muted);font-size:11px;line-height:1.5}.media-preview{display:grid;gap:8px;max-width:min(100%,290px)}.media-preview img{max-width:100%;max-height:150px;object-fit:contain;border-radius:14px}.media-preview video{max-width:100%;max-height:160px;border-radius:14px}.media-preview audio{max-width:100%;width:280px}.media-remove{justify-self:start}
/* study media and exact answers */
.study-card-main{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:13px}.study-question-text{display:block;overflow-wrap:anywhere;max-width:100%}.study-card-media{width:100%;display:grid;place-items:center;max-height:30vh;overflow:hidden}.study-card-media img{display:block;max-width:100%;max-height:26vh;object-fit:contain;border-radius:14px}.study-card-media video{display:block;max-width:100%;max-height:25vh;border-radius:12px}.study-card-media audio{display:block;width:min(100%,300px)}
.study-exact{display:grid;gap:11px;margin:12px 0}.study-exact label{font-size:12px;color:var(--muted);font-weight:600}.study-exact input{border:0;border-bottom:1px solid var(--muted);border-radius:0;background:transparent;color:var(--ink);font-size:16px;min-height:48px;outline:none}.study-exact input:focus{border-bottom:2px solid var(--ink)}.study-exact .button{justify-self:stretch}.study-exact-result{border-radius:15px;padding:12px 16px;font-size:13px;line-height:1.55;display:grid;gap:5px}.study-exact-result.correct{color:var(--greenText);background:var(--green)}.study-exact-result.incorrect{color:var(--redText);background:var(--red)}
.study-card{position:relative}.study-swipe-indicator{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;opacity:0;transition:opacity .12s ease}.study-swipe-indicator span{padding:12px 18px;background:#e8f2e9;border:1px solid #bcddc3;color:#2b6142;border-radius:999px;font-size:17px;font-weight:750;letter-spacing:-.025em}.study-card.drag-known .study-swipe-indicator,.study-card.drag-again .study-swipe-indicator{opacity:var(--swipe-alpha,.5)}.study-card.drag-again .study-swipe-indicator span{background:#faeaea;color:#915050;border-color:#efc7c7}.study-card.drag-known{border-color:#b8d4bf!important}.study-card.drag-again{border-color:#e3b8b8!important}
/* practical dark surfaces */
html[data-theme="dark"]{color-scheme:dark;--ink:#f1f0ed;--muted:#b3b2ad;--quiet:#979691;--line:#353735;--paper:#202321;--soft:#2b2e2b;--bg:#161918;--green:#223c2b;--greenText:#b9e2c2;--red:#422829;--redText:#e9b7b7}
html[data-theme="dark"] body,html[data-theme="dark"] .shell{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] .topbar,html[data-theme="dark"] .content,html[data-theme="dark"] .bottom-nav,html[data-theme="dark"] .account-menu,html[data-theme="dark"] .dialog,html[data-theme="dark"] .editor-card,html[data-theme="dark"] .study-screen,html[data-theme="dark"] .study-card,html[data-theme="dark"] .study-finish{background:var(--bg)!important;color:var(--ink)!important;border-color:var(--line)!important}
html[data-theme="dark"] .account-menu,html[data-theme="dark"] .dialog,html[data-theme="dark"] .editor-card,html[data-theme="dark"] .study-card{background:var(--paper)!important}
html[data-theme="dark"] .button:not(.primary),html[data-theme="dark"] .rate.flip,html[data-theme="dark"] .rate:not(.known):not(.again),html[data-theme="dark"] .auth-btn:not(.primary),html[data-theme="dark"] .tag,html[data-theme="dark"] .small-cover,html[data-theme="dark"] .bottom-nav button.active,html[data-theme="dark"] .list-go{background:var(--soft)!important;color:var(--ink)!important;border-color:var(--line)!important}
html[data-theme="dark"] .button.primary,html[data-theme="dark"] .mode-picker button.active{background:#ededed!important;color:#171717!important;border-color:#ededed!important}
html[data-theme="dark"] .top-menu-toggle,html[data-theme="dark"] .icon-btn,html[data-theme="dark"] .avatar{background:var(--soft);color:var(--ink)}
html[data-theme="dark"] .bottom-nav{background:rgba(34,36,34,.82)!important;box-shadow:0 12px 38px #0005}
html[data-theme="dark"] input:not([type=radio]):not([type=checkbox]):not([type=file]),html[data-theme="dark"] textarea,html[data-theme="dark"] select{background:transparent!important;color:var(--ink)!important;border-color:var(--line)!important}
html[data-theme="dark"] .auth{background:#171b1e!important}html[data-theme="dark"] .auth:before{opacity:.5}html[data-theme="dark"] .auth-sub,html[data-theme="dark"] .auth-note{color:#dedbd7}
@media(prefers-reduced-motion:reduce){.account-menu:not([hidden]),.account-menu.menu-closing{animation:none!important}.study-swipe-indicator{transition:none}}
/* Keep the study-mode pills in one scrollable row on narrow phones. */
.mode-picker{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:3px 2px 7px;max-width:100%}.mode-picker::-webkit-scrollbar{display:none}.mode-picker button{white-space:nowrap;flex:none}
@media(max-width:600px){#editor-list .editor-card .fields-2{grid-template-columns:1fr!important}#editor-list .editor-card textarea{min-height:95px}}


/* V4 — quiet native-style surfaces + a full height gate menu */
:root{--v4-surface:#fff;--v4-control:#f5f5f3;--v4-field:#fbfbfa;--v4-text:#171918;--v4-hair:#e9e9e6;--v4-shadow:0 16px 50px rgba(26,26,23,.065)}
html[data-theme="dark"]{--v4-surface:#222624;--v4-control:#2b302d;--v4-field:#222624;--v4-text:#f5f5f1;--v4-hair:#3a403b;--v4-shadow:0 15px 38px rgba(0,0,0,.18)}
body{background:var(--bg)!important}
.topbar,.content,.study-screen,.shell{background:var(--bg)!important;color:var(--ink)!important}
.auth .auth-shell{position:relative}
.auth.choice-step .auth-body{width:100%;max-width:340px;margin:auto auto clamp(90px,13dvh,150px)!important;align-self:center;text-align:center;z-index:2}
.auth.choice-step .auth-title{font-size:clamp(29px,8vw,39px)!important;line-height:1.14!important;max-width:none!important;letter-spacing:-.055em}
.auth.choice-step .auth-sub{max-width:280px!important;margin:14px auto 32px!important;font-size:13px!important;line-height:1.65}
.auth.choice-step .auth-actions{gap:10px}
.auth.choice-step .auth-header{align-items:flex-end;position:absolute;left:0;right:0;bottom:25px;top:auto;z-index:2;gap:9px;justify-content:space-between}
.auth.choice-step .auth-header .wordmark{font-size:19px;letter-spacing:-.065em}
.auth.choice-step .auth-header .role-small{font-size:11px;letter-spacing:.08em;text-transform:lowercase;font-weight:500}
.auth.email-step .auth-body,.auth.code-step .auth-body{margin:auto auto auto!important;max-width:360px;width:100%;align-self:center}
.auth.email-step .auth-title,.auth.code-step .auth-title{font-size:clamp(27px,8vw,36px)!important}
.auth.email-step .auth-header,.auth.code-step .auth-header{order:0}
.auth .auth-note{font-size:11px;line-height:1.4;max-width:260px}
.auth-grid{position:absolute;inset:10% 1% auto;width:100%;height:30dvh;min-height:190px;max-height:340px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:4px;pointer-events:none;opacity:.62;mask-image:linear-gradient(180deg,transparent,black 23%,black 67%,transparent);z-index:0}
.auth-grid-cell{display:grid;place-items:center;border-radius:5px;font-size:9px;font-weight:600;letter-spacing:.02em;color:rgba(65,60,72,.34);background:rgba(255,255,255,.095);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1),background .7s ease;user-select:none}
.auth-grid-cell.morph{opacity:.12;transform:scale(.83);background:rgba(255,255,255,.5)}
.auth.choice-step .auth-body{transform:none;animation:authV4Enter .56s cubic-bezier(.17,.85,.2,1) both}
@keyframes authV4Enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* portal rises bottom -> top; occupies entire viewport */
.account-menu{position:fixed!important;inset:0!important;left:0!important;right:0!important;top:0!important;bottom:0!important;width:100vw!important;max-width:none!important;height:100dvh!important;max-height:none!important;z-index:9000!important;margin:0!important;border:0!important;border-radius:0!important;padding:0 max(25px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(25px,env(safe-area-inset-left))!important;background:var(--bg)!important;color:var(--ink)!important;box-shadow:none!important;backdrop-filter:none!important;display:flex!important;flex-direction:column;overflow-y:auto!important;transform:translate3d(0,102%,0);opacity:1!important;transition:transform .62s cubic-bezier(.18,.94,.21,1);animation:none!important;will-change:transform;visibility:visible!important}
.account-menu[hidden]{display:none!important}
.account-menu.v4-open{transform:translate3d(0,0,0)!important}
.account-menu.v4-closing{transform:translate3d(0,102%,0)!important}
.account-menu::before{content:'';position:absolute;inset:0 0 auto;height:1px;background:var(--v4-hair)}
.v4-menu-shell{width:min(100%,520px);margin:0 auto;display:flex;flex-direction:column;flex:1;gap:0;min-height:min-content}
.v4-menu-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:30px 0 45px}
.v4-menu-head strong{font-size:19px;letter-spacing:-.06em}
.v4-menu-close{height:46px;width:46px;border:1px solid var(--v4-hair);border-radius:50%;display:grid;place-items:center;background:var(--v4-control);color:var(--ink)}
.v4-menu-eyebrow{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:16px}
.v4-menu-title{font:400 clamp(35px,9vw,52px)/1.07 Georgia,serif;letter-spacing:-.055em;margin:0 0 10px}
.v4-menu-sub{font-size:13px;color:var(--muted);margin:0 0 45px}
.v4-menu-row{border:0!important;border-bottom:1px solid var(--v4-hair)!important;background:transparent!important;color:var(--ink)!important;border-radius:0!important;min-height:66px!important;padding:12px 2px!important;gap:13px!important;display:flex!important;align-items:center!important;width:100%!important;text-align:left;font-size:14px!important;font-weight:570!important}
.v4-menu-row .row-tail{margin-left:auto;font-size:12px;color:var(--muted)}
.v4-menu-row:active{opacity:.7}
.v4-menu-row.danger{color:#9f5556!important}
.v4-menu-section{margin-top:24px}
.v4-lang{display:flex;gap:10px;align-items:center;flex-wrap:nowrap}
.v4-lang button{border-radius:999px;min-width:90px;min-height:40px;padding:0 16px;background:var(--v4-control);border:1px solid var(--v4-hair);color:var(--ink);font-size:12px;font-weight:600}
.v4-lang button[aria-pressed="true"]{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
.v4-menu-footer{margin-top:auto;padding-top:65px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.v4-gate-contents>*:not(.v4-menu-head){opacity:0;transform:translateY(14px);transition:opacity .3s ease,transform .36s ease}
.account-menu.v4-open .v4-gate-contents>*:not(.v4-menu-head){opacity:1;transform:none}
.account-menu.v4-open .v4-gate-contents>.v4-menu-title{transition-delay:.10s}
.account-menu.v4-open .v4-gate-contents>.v4-menu-sub{transition-delay:.14s}
.account-menu.v4-open .v4-gate-contents>.v4-menu-section{transition-delay:.18s}
/* Home center alignment / simpler density */
.v4-home-head{text-align:center;display:grid;gap:13px;justify-items:center;padding:14px 0 10px}
.v4-home-head h1{font:400 clamp(30px,7vw,43px)/1.12 Georgia,serif;letter-spacing:-.065em;margin:0}
.v4-home-head p{margin:0;color:var(--muted);font-size:13px}
.v4-home-activity{display:grid;justify-items:center;gap:8px;margin:38px auto 10px;max-width:480px}
.v4-home-activity .orbit-wrap{margin:0 auto;max-width:310px}
.v4-home-activity .orbital-svg{max-width:275px;display:block}
.v4-home-activity .v4-home-stat{font-size:13px;color:var(--muted);margin-top:8px}
.v4-home-activity .v4-home-stat strong{font-size:15px;color:var(--ink)}
.v4-home-activity .button{min-width:180px;margin-top:18px}
.v4-home-head .kicker{letter-spacing:.13em}
.home-content .section{margin-top:66px}
/* Editor: single card focus, tab strip and media controls */
.v4-editor-wrap{max-width:900px;margin:auto}
.v4-editor-title{font-size:clamp(25px,6vw,36px);margin:9px 0 7px;letter-spacing:-.055em;font-weight:600}
.v4-editor-toolbar{display:flex;align-items:start;justify-content:space-between;gap:18px;margin:12px 0 38px;flex-wrap:wrap}
.v4-deck-details{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px}
.v4-deck-details .field{margin-bottom:0}
.v4-card-switcher{display:flex;gap:10px;align-items:center;overflow:auto hidden;white-space:nowrap;scrollbar-width:none;padding:4px 0 22px}
.v4-card-switcher::-webkit-scrollbar{display:none}
.v4-card-tab{display:inline-flex;align-items:center;gap:8px;min-height:42px;border-radius:999px;border:1px solid var(--v4-hair);background:var(--v4-control);color:var(--muted);padding:0 16px;font-size:12px;font-weight:650;flex:none}
.v4-card-tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.v4-card-tab.add{background:transparent;border-style:dashed;color:var(--ink)}
.v4-active-card{display:grid;gap:14px;background:var(--v4-surface);border:1px solid var(--v4-hair);border-radius:27px;padding:26px}

/* V6 — diagonal motion + semantic day-scale contrast (light and dark) */
:root{
 --orbit-active:#252625;
 --orbit-idle:#e2e1dc;
 --heat-empty:#ededea;
 --heat-1:#dfd8ea;
 --heat-2:#c8bae2;
 --heat-3:#ad98d3;
 --heat-4:#9477c3;
 --heat-5:#6c539f;
}
html[data-theme="dark"]{
 --orbit-active:#d5c6ec;
 --orbit-idle:#343c37;
 --heat-empty:#303632;
 --heat-1:#544967;
 --heat-2:#74618e;
 --heat-3:#987ebe;
 --heat-4:#bea2e6;
 --heat-5:#e0cdf8;
}
/* Keep the user's existing motion-based animation; rotate its grid into the diagonal. */
.auth{overflow:hidden}
.auth:before{
 background:
 radial-gradient(ellipse 52% 48% at 17% 13%,rgba(194,181,252,.73),transparent 85%),
 radial-gradient(ellipse 45% 48% at 74% 43%,rgba(251,189,194,.72),transparent 84%),
 radial-gradient(ellipse 52% 48% at 32% 72%,rgba(255,225,192,.68),transparent 85%),
 radial-gradient(ellipse 48% 45% at 91% 91%,rgba(210,204,249,.68),transparent 90%),
 linear-gradient(134deg,#f7f6f5 0%,#eee6f4 30%,#f7e8e1 64%,#f8f7f4 100%);
}
.auth.teacher:before{
 background:
 radial-gradient(ellipse 50% 47% at 16% 10%,rgba(176,206,250,.76),transparent 86%),
 radial-gradient(ellipse 48% 48% at 76% 42%,rgba(213,197,243,.68),transparent 86%),
 radial-gradient(ellipse 50% 50% at 32% 84%,rgba(215,235,232,.73),transparent 88%),
 linear-gradient(134deg,#f8f8f7,#e4e8f3 41%,#edf0ed 76%,#f8f8f7);
}
.auth-grid{
 inset:3% auto auto -14%!important;
 width:128%!important;
 height:clamp(200px,36dvh,390px)!important;
 max-height:none!important;
 transform:rotate(-17deg) translateZ(0);
 transform-origin:50% 50%;
 opacity:.53;
 mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 72%,transparent 100%);
 -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 72%,transparent 100%);
}
.auth-grid-cell{border-radius:6px}
@media(max-width:760px){.auth-grid{inset:8% auto auto -17%!important;width:135%!important;height:clamp(180px,31dvh,330px)!important}}
/* Accessible spatial encoding without painful white unstudied cells or invisible active dots. */
.orbital{width:min(100%,292px);max-width:292px;aspect-ratio:1;isolation:isolate}
.orbital svg{width:100%;height:100%;display:block;overflow:visible}
.orbital-center{max-width:42%;width:42%;z-index:1;pointer-events:none}
.orbital-count{font-size:clamp(33px,9vw,46px);font-weight:520;letter-spacing:-.065em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.orbital-count[data-digits="4"]{font-size:32px;letter-spacing:-.055em}
.orbital-count[data-digits="5"]{font-size:25px;letter-spacing:-.045em}

.v4-home-activity{max-width:100%;min-width:0}
.v4-home-activity .v4-home-stat{max-width:calc(100vw - 48px);text-wrap:balance;overflow-wrap:anywhere;color:var(--muted);font-size:13px;line-height:1.5;margin:4px auto 0;text-align:center}

.heatmap{display:grid;grid-template-columns:repeat(19,minmax(0,1fr));gap:clamp(3px,.75vw,5px);min-width:0;width:100%}
.heat-square,.heat-square:not([class*="l"]){background:var(--heat-empty)!important;border-radius:clamp(2px,.7vw,4px);box-shadow:none!important;min-width:0;aspect-ratio:1/1}

function translateUI(raw){
  if(uiLanguage!=='en'||!raw||!raw.trim())return raw;
  const normalized=raw.trim();
  let result=UI_STRINGS[normalized];
  if(result===undefined){
    result=normalized
      .replace(/\b(\d+) de (\d+) revisões na meta de hoje\b/g,'$1 of $2 reviews in today’s goal')
      .replace(/^Olá, (.+)\.$/,'Hello, $1.')
      .replace(/\b(\d+) de (\d+) revisões na meta de hoje\b/g,'$1 of $2 reviews in today’s goal')
      .replace(/\b(\d+) de (\d+)\b/g,'$1 of $2')
      .replace(/(\d+) decks disponíveis/g,'$1 decks available')
      .replace(/\b(\d+) turmas\b/g,'$1 classes')
      .replace(/\b1 classes\b/g,'1 class')
      .replace(/\b1 decks\b/g,'1 deck')
      .replace(/\b1 cards\b/g,'1 card')
      .replace(/\b(\d+) feitos\b/g,'$1 done')
      .replace(/\b(\d+) restantes\b/g,'$1 remaining')
      .replace(/\b(\d+) revisados\b/g,'$1 reviewed')
      .replace(/\b(\d+) cartões\b/g,'$1 cards')
      .replace(/\b(\d+) cartão\b/g,'$1 card')
      .replace(/\b(\d+) alunos\b/g,'$1 students')
      .replace(/\b(\d+) aluno\b/g,'$1 student')
      .replace(/\b(\d+) decks disponíveis\b/g,'$1 decks available')
      .replace(/\b(\d+) decks estudados\b/g,'$1 decks studied')
      .replace(/\b(\d+) respostas\b/g,'$1 responses')
      .replace(/\b(\d+) revisões\b/g,'$1 reviews')
      .replace(/\b(\d+) dias\b/g,'$1 days')
      .replace(/\b(\d+) de (\d+)\b/g,'$1 of $2')
      .replace(/\bNenhuma turma\b/g,'No classes')
      .replace(/\bSem dados\b/g,'No data');
    if(result===normalized){for(const [pt,en] of Object.entries(UI_STRINGS)){
      if(normalized.startsWith(pt+' · ')){result=en+normalized.slice(pt.length);break}
    }}
  }
  return raw.replace(normalized,result);
}

function dotOrbit(done,goal){let dots='';const rings=[14,22,30,38];let i=0;const limit=Math.round(Math.min(1,done/Math.max(goal,1))*104);rings.forEach((n,r)=>{for(let j=0;j<n;j++){const a=(j/n*Math.PI*2)-Math.PI/2;const dist=35+r*23;const x=140+Math.cos(a)*dist,y=140+Math.sin(a)*dist;const active=i++<limit;dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r===0?3:2.35}" fill="${active?'#242524':'#dededa'}"/>`}});return `<div class="orbital"><svg viewBox="0 0 280 280" aria-hidden="true">${dots}</svg><div class="orbital-center"><strong class="orbital-count">${done}</strong><span class="orbital-label">revisões hoje</span></div></div>`}
function myStudyAssignments(){return studentAssignments()}
function newDue(){const a=myStudyAssignments();return a.reduce((s,x)=>s+x.deck.cards.length,0)}
function studentHome(){const as=myStudyAssignments(),ms=memberships(),today=outcomes({userId:'s1'}).filter(a=>iso(a.at)===iso()).length;const goal=Math.max(10,newDue());const next=as[0];return `<div class="home-content"><div class="home-headrow"><div><div class="kicker">SEU ESPAÇO</div><h1 class="greeting" style="margin-top:10px">Olá, ${E(session.name)}.</h1><p class="home-sub">Que tal uma revisão hoje?</p></div><button class="icon-btn" data-act="nav" data-page="activity" aria-label="Ver atividade">${icon('chart',18)}</button></div><div class="student-activity">${dotOrbit(today,goal)}<h2>Uma revisão por vez.</h2><p>${today} de ${goal} revisões na meta de hoje</p><button class="button primary" data-act="start" data-scope="all" ${as.length?'':'disabled'}>${icon('cards',16)} Começar revisão</button></div>${section('Próximos estudos',as.slice(0,2).map(a=>deckItem(a.deck,'start-deck')).join('')||`<div class="empty">Entre em uma turma para começar.</div>`,'Ver todos','show-decks')}${section('Minhas turmas',ms.slice(0,2).map(m=>classItem(getClass(m.classId))).join('')||`<div class="empty">Você ainda não entrou em uma turma.</div>`,'Ver todas','show-classes')}</div>`}
function studentClasses(){const cs=memberships().map(m=>getClass(m.classId)).filter(Boolean);return heading('ORGANIZAÇÃO','Minhas turmas','Os conteúdos compartilhados pelos professores.',`<button class="button primary" data-act="modal-join">${icon('plus',16)} Entrar em turma</button>`)+`<div class="list">${cs.map(c=>classItem(c)).join('')||`<div class="empty"><strong>Nenhuma turma ainda.</strong>Use um código de turma para começar.</div>`}</div>`}
function studentClassDetail(){const c=getClass(selectedClass);if(!c)return `<div class="empty">Turma não encontrada.</div>`;const ds=classDecks(c.id);return `<button class="link-button" data-act="show-classes">${icon('back',16)} Minhas turmas</button>${heading(E(c.subject),c.name,`${ds.length} conjuntos disponíveis`,ds.length?`<button class="button primary" data-act="start" data-scope="class" data-id="${E(c.id)}">Estudar turma ${icon('arrow',16)}</button>`:'')}<div class="list">${ds.map(d=>deckItem(d,'start-deck')).join('')||`<div class="empty">O professor ainda não atribuiu decks.</div>`}</div>`}
function studentDecks(){const all=myStudyAssignments();const unique=all.filter((a,i)=>all.findIndex(b=>b.deckId===a.deckId)===i);const filtered=navFilter?unique.filter(a=>a.classId===navFilter):unique;const opts=memberships().map(m=>getClass(m.classId)).filter(Boolean);return heading('BIBLIOTECA','Seus decks','Estude por conjunto ou misture todos.',`<button class="button primary" data-act="start" data-scope="all" ${all.length?'':'disabled'}>${icon('shuffle',16)} Estudar tudo</button>`)+(opts.length>1?`<div class="chip-scroll"><button class="${!navFilter?'active':''}" data-act="filter-class" data-id="">Todas as turmas</button>${opts.map(c=>`<button class="${navFilter===c.id?'active':''}" data-act="filter-class" data-id="${c.id}">${E(c.name)}</button>`).join('')}</div>`:'')+`<div class="list">${filtered.map(a=>deckItem(a.deck,'start-deck')).join('')||`<div class="empty">Sem cartões disponíveis.</div>`}</div>`}
function heatmap(userId='s1'){const map={};outcomes({userId}).forEach(a=>{const day=iso(a.at);map[day]=(map[day]||0)+1});let cells='';for(let days=132;days>=0;days--){const now=new Date();now.setDate(now.getDate()-days);const k=iso(now);const n=map[k]||0;cells+=`<span title="${k}: ${n} revisões" class="heat-square ${n?'l'+Math.min(4,Math.ceil(n/3)):''}"></span>`}return `<div class="heatmap" aria-label="Histórico de estudos em dias"></div>`.replace('</div>',cells+'</div>')+`<div class="heatmap-label"><span>18 semanas atrás</span><span>Hoje</span></div>`}
function studentActivity(){const att=outcomes({userId:'s1'}),today=att.filter(x=>iso(x.at)===iso()).length,rate=percent(att);return heading('CONTINUIDADE','Sua atividade','Pequenas revisões, ao longo do tempo.')+`<div class="metric-hero"><strong>${today}</strong><span>cartões revisados hoje</span></div>${section('Histórico de revisões',heatmap())}<section class="section"><div class="statstrip"><div><b>${att.length}</b><span>revisões</span></div><div><b>${rate}%</b><span>lembrança</span></div><div><b>${newDue()}</b><span>cartões disponíveis</span></div></div></section>${section('Seus conjuntos',myStudyAssignments().slice(0,4).map(a=>deckItem(a.deck,'start-deck')).join(''))}`}
function beginStudy(scope='all',target=''){let assignments=myStudyAssignments();if(scope==='class')assignments=assignments.filter(a=>a.classId===target);if(scope==='deck')assignments=assignments.filter(a=>a.deckId===target);let seen=new Set();let q=[];for(const a of assignments){for(const card of a.deck.cards){const key=a.deckId+':'+card.id;if(seen.has(key))continue;seen.add(key);q.push({deckId:a.deckId,cardId:card.id,classId:a.classId})}};if(!q.length){notify('Nenhum cartão disponível');return}if(scope==='all'||scope==='class')q=shuffled(q);study={queue:q,index:0,revealed:false,history:[],scope,attempts:[],startingLength:q.length};page='study';render(true)}
function shuffled(arr){const out=[...arr];for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
const currentCard=()=>{const item=study?.queue?.[study.index],deck=getDeck(item?.deckId);return {item,deck,card:deck?.cards.find(c=>c.id===item?.cardId)}};
function updateFlip(){if(!study)return;study.revealed=!study.revealed;const {card,deck}=currentCard();const el=document.getElementById('flash-card');if(!el)return;el.querySelector('.study-card-main').textContent=study.revealed?card.a:card.q;el.querySelector('.study-card-main').classList.toggle('answer',study.revealed);el.querySelector('.study-card-top .face-text').textContent=study.revealed?(uiLanguage==='en'?'ANSWER':'RESPOSTA'):(uiLanguage==='en'?'QUESTION':'PERGUNTA');el.setAttribute('aria-label',study.revealed?(uiLanguage==='en'?'Show question':'Mostrar pergunta'):(uiLanguage==='en'?'Show answer':'Mostrar resposta'));el.classList.remove('flip-transition');void el.offsetWidth;el.classList.add('flip-transition');document.getElementById('flip-btn').textContent=study.revealed?(uiLanguage==='en'?'Question':'Pergunta'):(uiLanguage==='en'?'Flip':'Virar');}
function recordRate(outcome){if(!study)return;const cur=currentCard();if(!cur.card)return;const attempt={id:id(),userId:'s1',classId:cur.item.classId,deckId:cur.item.deckId,cardId:cur.item.cardId,outcome,at:Date.now()};db.attempts.push(attempt);study.history.push({...cur.item,attemptId:attempt.id,outcome});study.attempts.push(outcome);study.index++;study.revealed=false;save();const c=document.getElementById('flash-card');if(c&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){c.classList.add(outcome==='known'?'out-right':'out-left');setTimeout(()=>render(false),175)}else render(false)}
function skip(){if(!study)return;const cur=study.queue.splice(study.index,1)[0];study.queue.push(cur);study.revealed=false;render(false)}
function shuffleRemaining(){if(!study)return;const tail=study.queue.slice(study.index);if(tail.length<2){notify('Restou apenas um cartão');return};let next=shuffled(tail);if(next.length===2&&next[0].cardId===tail[0].cardId)next.reverse();study.queue=[...study.queue.slice(0,study.index),...next];study.revealed=false;render(false);notify('Ordem embaralhada')}
function undo(){if(!study?.history.length)return;const h=study.history.pop();study.attempts.pop();db.attempts=db.attempts.filter(a=>a.id!==h.attemptId);study.index=Math.max(0,study.index-1);study.revealed=false;save();render(false);notify('Última avaliação desfeita')}
function studyPage(){if(!study)return '';if(study.index>=study.queue.length)return finishPage();const {card,deck}=currentCard();if(!card)return '';const done=study.index,total=study.queue.length,pct=total?Math.round(done/total*100):0;return `<div class="study-screen"><div class="study-head"><button data-act="study-back" class="button" aria-label="Voltar">${icon('back',17)} Voltar</button><div class="counter">${done+1} / ${total}</div><div class="study-topactions"><button class="button" data-act="study-shuffle" title="Embaralhar">${icon('shuffle',15)} <span class="desktop-label">Misturar</span></button><button class="button" data-act="study-skip">Pular</button></div></div><button id="flash-card" type="button" class="study-card" data-act="study-flip" aria-label="${study.revealed?'Mostrar pergunta':'Mostrar resposta'}"><div class="study-card-top"><span>${E(deck.subject)}</span><span class="face-text">${study.revealed?'RESPOSTA':'PERGUNTA'}</span></div><div class="study-card-main ${study.revealed?'answer':''}">${E(study.revealed?card.a:card.q)}</div><div class="study-card-foot"><span>mydeck</span><i class="study-dot"></i></div></button><div class="study-footer"><div class="progress-row"><span>${done} feitos</span><div class="progress-line"><span style="width:${pct}%"></span></div><span>${total-done} restantes</span></div><div class="rate-row"><button class="rate again" data-act="study-rate" data-outcome="again">${icon('x',16)} Errei</button><button class="rate flip" id="flip-btn" data-act="study-flip">${study.revealed?'Pergunta':'Virar'}</button><button class="rate known" data-act="study-rate" data-outcome="known">${icon('check',16)} Acertei</button></div></div></div>`}
function finishPage(){const known=study.attempts.filter(x=>x==='known').length,total=study.queue.length;return `<div class="study-finish"><div class="finish-mark">${icon('check',28)}</div><h1 class="finish-title">Boa sessão.</h1><p class="finish-desc">Cada cartão revisado é um pequeno avanço.</p><div class="finish-stats"><div><b>${total}</b><span>revisados</span></div><div><b>${known}</b><span>lembrei</span></div><div><b>${total-known}</b><span>errei</span></div></div><div class="finish-actions"><button data-act="study-restart" class="button primary">${icon('rotate',16)} Revisar novamente</button><button data-act="study-back" class="button">Voltar aos conteúdos</button>${study.history.length?`<button class="link-button" data-act="study-undo" style="justify-content:center">Desfazer última avaliação</button>`:''}</div></div>`}
function teacherClasses(){const cs=ownedClasses();return heading('ESPAÇO DO PROFESSOR','Turmas','Organize conteúdos e acompanhe cada turma.',`<button class="button primary" data-act="class-new">${icon('plus',16)} Nova turma</button>`)+`<div class="list">${cs.map(c=>classItem(c)).join('')||`<div class="empty"><strong>Comece por uma turma.</strong>Depois você poderá atribuir decks e convidar alunos.</div>`}</div>`}
function classDetail(){const c=getClass(selectedClass);if(!c)return '<div class="empty">Turma não encontrada.</div>';const ds=classDecks(c.id),ms=classMembers(c.id),attempts=outcomes({classId:c.id}),rate=percent(attempts);const tabs=[['decks','Conteúdos'],['students','Alunos'],['performance','Desempenho']];let body='';if(detailTab==='decks')body=`<div class="list">${ds.map(d=>deckItem(d,'deck-edit')).join('')||`<div class="empty"><strong>Sem conteúdos.</strong>Crie um deck ou atribua um existente.</div>`}</div>`;else if(detailTab==='students')body=`<div class="list">${ms.map(m=>`<div class="list-item"><span class="avatar">${E(m.name[0])}</span><div class="list-item-main"><div class="list-item-title">${E(m.name)}</div><div class="list-item-meta">${E(v15HandleFor(m.userId))} · ${outcomes({classId:c.id,userId:m.userId}).length} respostas registradas</div></div><div class="list-action"><span class="metric-small"><strong>${percent(outcomes({classId:c.id,userId:m.userId}))}%</strong></span>${openButton('student-open',`data-id="${E(m.userId)}"`)}</div></div>`).join('')||'<div class="empty">Nenhum aluno matriculado.</div>'}</div>`;else body=analyticsContent({classId:c.id},false);
return `<button class="link-button" data-act="show-classes">${icon('back',16)} Todas as turmas</button><div class="page-intro" style="margin-top:23px"><div>${cover(c,'small-cover '+c.tone)}<h1 class="page-title" style="margin-top:20px">${E(c.name)}</h1><p class="page-desc">${E(c.subject)} · código ${E(c.code)}</p></div><button class="icon-btn" title="Editar turma" data-act="class-edit" data-id="${E(c.id)}">${icon('edit')}</button></div><div class="statstrip"><div><b>${ms.length}</b><span>alunos</span></div><div><b>${ds.length}</b><span>decks</span></div><div><b>${attempts.length?rate+'%':'—'}</b><span>lembraram</span></div></div><div class="head-actions" style="margin-bottom:28px"><button class="button primary" data-act="deck-new" data-class="${E(c.id)}">${icon('plus',15)} Criar deck</button><button class="button" data-act="assign-open" data-class="${E(c.id)}">Atribuir existente</button><button class="button" data-act="invite-open">${icon('copy',15)} Código</button></div><nav class="tabs" aria-label="Dados da turma">${tabs.map(([key,label])=>`<button class="${detailTab===key?'active':''}" data-act="tab" data-tab="${key}">${label}</button>`).join('')}</nav><div style="padding-top:16px">${body}</div>`}
function teacherDecks(){return heading('BIBLIOTECA','Decks','Crie uma vez. Compartilhe com quantas turmas quiser.',`<button class="button primary" data-act="deck-new">${icon('plus',16)} Novo deck</button>`)+`<div class="list">${ownedDecks().map(d=>`<div class="list-item">${cover(d)}<div class="list-item-main"><div class="list-item-title">${E(d.title)}</div><div class="list-item-meta">${d.cards.length} cartões · ${db.assignments.filter(a=>a.deckId===d.id).length} turmas</div></div><div class="inline-actions"><button class="button" data-act="deck-edit" data-id="${E(d.id)}">Editar</button><button class="button" data-act="assign-open" data-id="${E(d.id)}">Atribuir</button></div></div>`).join('')||'<div class="empty">Crie seu primeiro deck.</div>'}</div>`}
function teacherEditor(){if(!editor)return '';return `<button data-act="editor-cancel" class="link-button">${icon('back',16)} Voltar aos decks</button><div class="editor-header" style="margin-top:18px"><div><div class="kicker">EDITOR DE CONTEÚDO</div><h1 class="page-title">${editor.id?'Editar deck':'Novo deck'}</h1><p class="page-desc">Pergunta, resposta e tags reutilizáveis em cada cartão.</p></div><div class="head-actions"><button class="button" data-act="editor-cancel">Cancelar</button><button class="button primary" data-act="editor-save">Salvar deck ${icon('check',16)}</button></div></div><div class="fields-2"><div class="field"><label for="deck-title">Nome do deck</label><input id="deck-title" data-edit="title" value="${E(editor.title)}" placeholder="Ex.: Células e suas funções"></div><div class="field"><label for="deck-subject">Matéria</label><input id="deck-subject" data-edit="subject" value="${E(editor.subject)}" placeholder="Ex.: Biologia"></div></div><div class="fields-2"><div class="field"><label for="deck-emoji">Emoji ou símbolo</label><input id="deck-emoji" data-edit="emoji" value="${E(editor.emoji)}" placeholder="◒" maxlength="12"></div><div class="field"><label for="deck-tags">Tags do deck (separadas por vírgula)</label><input id="deck-tags" data-edit="tags" value="${E(editor.tags.join(', '))}" placeholder="energia, células"></div></div><div class="field"><label>Cor do deck</label><div class="color-row">${COLORS.map(c=>`<button class="color-choice ${editor.tone===c?'active':''}" type="button" data-act="edit-color" data-tone="${c}" style="background:${{gray:'#ebe9e5',purple:'#e9e0f7',blue:'#e4e9f8',green:'#e3efe5',peach:'#fae8e2'}[c]}" aria-label="Cor ${c}"></button>`).join('')}</div></div><div class="section-head" style="margin:42px 0 8px"><h2>Flashcards <span style="color:#a2a2a0;margin-left:4px">${editor.cards.length}</span></h2><button class="link-button" data-act="card-add">${icon('plus',15)} Adicionar cartão</button></div><div id="editor-list">${editor.cards.map((c,i)=>`<div class="editor-card" data-id="${E(c.id)}"><div class="editor-card-header"><span class="editor-card-num">CARTÃO ${String(i+1).padStart(2,'0')}</span><button class="icon-btn" data-act="card-delete" data-id="${E(c.id)}" aria-label="Excluir cartão">${icon('trash',16)}</button></div><div class="fields-2"><div class="field"><label>Pergunta</label><textarea data-cid="${E(c.id)}" data-cardfield="q" placeholder="Escreva a pergunta">${E(c.q)}</textarea></div><div class="field"><label>Resposta</label><textarea data-cid="${E(c.id)}" data-cardfield="a" placeholder="Escreva a resposta">${E(c.a)}</textarea></div></div><div class="field" style="margin-bottom:0"><label>Tags deste cartão (separadas por vírgula)</label><input data-cid="${E(c.id)}" data-cardfield="tags" value="${E((c.tags||[]).join(', '))}" placeholder="Ex.: energia, organelas"></div></div>`).join('')}</div><div class="editor-actions"><button class="button" data-act="card-add">${icon('plus',16)} Novo cartão</button><button class="button primary" data-act="editor-save">Salvar deck</button></div>`}
const analyticsSet=f=>{let r=outcomes(f);if(APP==='teacher')r=r.filter(x=>ownedClasses().some(c=>c.id===x.classId));return r};
function analyticsContent(filters,showFilters=true){const a=v11FilterDates(analyticsSet(filters));let rate=percent(a);const decks=ownedDecks().filter(d=>!filters.deckId||d.id===filters.deckId);const tags=allTags().filter(t=>!filters.tag||norm(t)===norm(filters.tag));const chart=trendSVG(a);return `${showFilters?`<div class="filterbar" style="margin-bottom:30px"><select data-filter="classId" aria-label="Filtrar turma"><option value="">Todas as turmas</option>${ownedClasses().map(c=>`<option value="${c.id}" ${filters.classId===c.id?'selected':''}>${E(c.name)}</option>`).join('')}</select><select data-filter="deckId" aria-label="Filtrar deck"><option value="">Todos os decks</option>${ownedDecks().map(d=>`<option value="${d.id}" ${filters.deckId===d.id?'selected':''}>${E(d.title)}</option>`).join('')}</select><select data-filter="tag" aria-label="Filtrar tag"><option value="">Todas as tags</option>${allTags().map(t=>`<option value="${E(t)}" ${filters.tag===t?'selected':''}>#${E(t)}</option>`).join('')}</select></div>`:''}<div class="metric-hero"><strong>${a.length?rate+'%':'—'}</strong><span>taxa de lembrança · ${a.length} respostas</span></div>${chart}${section('Por deck',`<div class="list">${decks.filter(d=>a.some(at=>at.deckId===d.id)).map(d=>resultRow(d.title,a.filter(at=>at.deckId===d.id))).join('')||'<div class="empty">Sem respostas para os filtros.</div>'}</div>`)}${section('Por tag',`<div class="list">${tags.map(t=>{const at=a.filter(x=>(getDeck(x.deckId)?.cards.find(c=>c.id===x.cardId)?.tags||[]).map(norm).includes(norm(t))||(getDeck(x.deckId)?.tags||[]).map(norm).includes(norm(t)));return at.length?resultRow('#'+t,at):''}).join('')||'<div class="empty">Sem dados por tag.</div>'}</div>`)}${section('Cartões com maior dificuldade',`<div class="list">${hardestCards(a).map(x=>resultRow(x.q,x.a)).join('')||'<div class="empty">Sem respostas suficientes.</div>'}</div>`)}`}
function resultRow(title,attempts){const p=percent(attempts);return `<div class="result-row"><div><div class="list-item-title">${E(title)}</div><div class="list-item-meta">${attempts.length} respostas</div></div><div class="bar"><span style="width:${p}%"></span></div><span class="result-percent ${p<50?'low':''}">${p}%</span></div>`}
function hardestCards(a){let map=new Map();for(const x of a){const d=getDeck(x.deckId),c=d?.cards.find(c=>c.id===x.cardId);if(!c)continue;let key=d.id+':'+c.id;if(!map.has(key))map.set(key,{q:c.q,a:[]});map.get(key).a.push(x)}return [...map.values()].sort((a,b)=>percent(a.a)-percent(b.a)).slice(0,4)}
function trendSVG(a){const n=7;const vals=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const list=a.filter(x=>iso(x.at)===iso(d));vals.push(list.length?percent(list):null)}let last=0;const points=vals.map((v,i)=>{if(v!=null)last=v;return `${24+i*55},${128-last*1.02}`}).join(' ');let circles=vals.map((v,i)=>`<circle cx="${24+i*55}" cy="${128-(v==null?0:v)*1.02}" r="2.4" fill="#222"/>`).join('');return `<svg class="chart" viewBox="0 0 386 150" preserveAspectRatio="none" aria-label="Tendência de desempenho na última semana" role="img"><line x1="0" x2="386" y1="138" y2="138" stroke="#efefec"/><polyline points="${points}" fill="none" stroke="#232323" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>${circles}<g font-size="10" fill="#aaa"><text x="0" y="149">7 dias atrás</text><text x="342" y="149">Hoje</text></g></svg>`}

function daysStreak(){
  if(APP==='teacher')return ownedClasses().length;
  const dates=new Set(db.attempts.filter(a=>a.userId==='s1').map(a=>iso(a.at)));
  let d=new Date(),n=0;if(!dates.has(iso(d)))d.setDate(d.getDate()-1);
  while(dates.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n;
}

// V6 — fixed-size progress visualization, with real 3+ digit totals.
// Each dot represents a share of the goal rather than exactly one card.
dotOrbit=function(done,goal){
 const count=Math.max(0,Number(done)||0),target=Math.max(1,Number(goal)||1);
 const rings=[16,24,28,36],radii=[57,78,99,120],size=320;
 const total=rings.reduce((a,b)=>a+b,0),filled=Math.round(Math.min(1,count/target)*total);
 let i=0,dots='';
 rings.forEach((n,r)=>{
  for(let j=0;j<n;j++){
   const angle=-Math.PI/2+(j/n)*Math.PI*2;
   const x=size/2+Math.cos(angle)*radii[r],y=size/2+Math.sin(angle)*radii[r];
   const active=i++<filled;
   dots+=`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r===0?3.0:2.55}" fill="var(${active?'--orbit-active':'--orbit-idle'})"/>`;
  }
 });
 const digits=String(Math.floor(count)).length;
 const label=uiLanguage==='en'?`${count} reviews today of a goal of ${target}`:`${count} revisões hoje de uma meta de ${target}`;
 return `<div class="orbital" role="img" aria-label="${label}"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true">${dots}</svg><div class="orbital-center" aria-hidden="true"><strong class="orbital-count" data-digits="${Math.min(digits,5)}">${count.toLocaleString(uiLanguage==='en'?'en-US':'pt-BR')}</strong></div></div>`;
};
// Keep the daily target stable when the number of cards grows above 100.

const v6PreviousStudentHome=studentHome;
studentHome=function(){
 const today=outcomes({userId:'s1'}).filter(a=>iso(a.at)===iso()).length;
 const goal=Math.max(40,newDue());
 const markup=v6PreviousStudentHome();
 const done=uiLanguage==='en'?'Goal completed':'Meta concluída';
 const excess=today-goal;
 const text=excess>=0?`${done}${excess>0?' · +'+excess+(uiLanguage==='en'?' extra reviews':' revisões extras'):''}`:(uiLanguage==='en'?`${today} of ${goal} reviews today`:`${today} de ${goal} revisões hoje`);
 return markup.replace(/<div class="v4-home-stat"><strong>\d+<\/strong> de \d+ revisões hoje<\/div>/,
  `<div class="v4-home-stat">${text}</div>`);
};
// From 1 review/day to 200+, use six well-separated heatmap levels.
heatmap=function(userId='s1'){
 const counts={};
 outcomes({userId}).forEach(a=>{const day=iso(a.at);counts[day]=(counts[day]||0)+1});
 let cells='';
 for(let days=132;days>=0;days--){
  const day=new Date();day.setDate(day.getDate()-days);
  const key=iso(day),n=counts[key]||0;
  const level=n===0?0:n>=100?5:n>=25?4:n>=10?3:n>=4?2:1;
  const tooltip=uiLanguage==='en'?`${key}: ${n} reviews`:`${key}: ${n} revisões`;
  cells+=`<span title="${tooltip}" aria-label="${tooltip}" class="heat-square ${level?'l'+level:''}"></span>`;
 }

 const totals=valid.reduce((o,v)=>{const a=tally.get(v.key);o.count+=a.count;o.correct+=a.correct;return o},{count:0,correct:0});
 return `<div class="v15-chart-card v11-trend" role="group"><div class="v15-chart-head"><strong>${v15T('rate')} · ${E(monthlyCaption)}</strong><span class="v15-chart-sub">${totals.count?Math.round(totals.correct/totals.count*100)+'%':'—'} · ${totals.correct} ${v15T('correct')} / ${totals.count} ${v15T('answers')}</span></div><div class="v15-plot-scroller" tabindex="0" aria-label="${v15T('chartHelp')}">${svg}</div><div class="v11-tooltip" role="status" aria-live="polite" hidden><span class="v11-tip-label"></span><strong class="v11-tip-rate"></strong><small class="v11-tip-count"></small></div><div class="v15-chart-foot"><span>${v15T('chartHelp')}</span>${!totals.count?`<span>${v15T('noData')}</span>`:''}</div></div>`;
}
// Replace old generic graph by a month/year view without additional conflicting date toolbars.
analyticsContent=function(filters,showFilters=true){
 const classId=showFilters?(filters.classId||''):(filters.classId||'');
 const selected=v15ActiveStudent&&v15TeacherStudents(classId).some(s=>s.id===v15ActiveStudent)?v15ActiveStudent:'';
 const all=analyticsSet(filters).filter(a=>!selected||a.userId===selected);
 const entries=v15TimelineSubset(all),correct=entries.filter(a=>a.outcome==='known'||a.correct===true).length;
 const headline=`<div class="metric-hero"><strong>${entries.length?Math.round(100*correct/entries.length)+'%':'—'}</strong><span>${v15T('rate').toLowerCase()} · ${entries.length} ${v15T('answers')}</span></div>`;
 const deckSet=ownedDecks().filter(d=>!filters.deckId||d.id===filters.deckId);
 const tags=allTags().filter(t=>!filters.tag||norm(t)===norm(filters.tag));
 const byDeck=deckSet.filter(d=>entries.some(a=>a.deckId===d.id)).map(d=>resultRow(d.title,entries.filter(a=>a.deckId===d.id))).join('');
 const byTag=tags.map(tag=>{const a=entries.filter(x=>(getDeck(x.deckId)?.cards.find(c=>c.id===x.cardId)?.tags||[]).map(norm).includes(norm(tag))||(getDeck(x.deckId)?.tags||[]).map(norm).includes(norm(tag)));return a.length?resultRow('#'+tag,a):''}).join('');
 return v15ResultsFilters(filters,showFilters)+v15StudentSearch(classId)+(selected?v15StudentSummary(selected):'')+v15PeriodControls()+headline+v15Plot(all)+`<div class="v15-results-stack">${section(v15T('perDeck'),`<div class="list">${byDeck||`<div class="empty">${v15T('noData')}</div>`}</div>`)}${section(v15T('perTag'),`<div class="list">${byTag||`<div class="empty">${v15T('noData')}</div>`}</div>`)}${section(v15T('hardest'),`<div class="list">${hardestCards(entries).map(x=>resultRow(x.q,x.a)).join('')||`<div class="empty">${v15T('noData')}</div>`}</div>`)}</div>`;
};
const v15OriginalStudentDetail=teacherStudentDetail;
teacherStudentDetail=function(){
 const member=classMembers(selectedClass).find(m=>m.userId===selectedStudent);
 if(!member)return v15OriginalStudentDetail();
 const global=v15StudentSummary(selectedStudent),a=outcomes({classId:selectedClass,userId:selectedStudent});
 const html=v15OriginalStudentDetail();
 return html.replace('<div class="statstrip">',`<p class="v15-inline-handle">${E(v15HandleFor(selectedStudent))}</p><div class="statstrip">`)+global;
};
const v15BeforeSidebar=v9SidebarMarkup;
v9SidebarMarkup=function(){const html=v15BeforeSidebar();if(APP!=='student')return html;
 const btn=`<button type="button" class="v15-profile-edit" data-v15-edit-handle>${E(v15HandleFor(session?.uid||'s1'))} · ${uiLanguage==='en'?'Edit':'Editar'}</button>`;
 return html.replace(/(<small title="[^"]*">[^<]*<\/small>)/,(_all,tag)=>tag+btn);
};
const v15BeforeAccountDropdown=accountDropdown;
accountDropdown=function(){let h=v15BeforeAccountDropdown();if(APP!=='student')return h;
 const at=h.lastIndexOf('</div>');if(at<0)return h;
 return h.slice(0,at)+`<button type="button" class="account-menu-item" data-v15-edit-handle>${v15T('handle')}: ${E(v15HandleFor(session?.uid||'s1'))}</button>`+h.slice(at);
};
const v15BeforeRenderModal=renderModal;
renderModal=function(){if(modal!=='v15-handle')return v15BeforeRenderModal();
 return `<div class="overlay" id="overlay" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-label="${v15T('handle')}"><button type="button" data-act="modal-close" aria-label="${v15T('cancel')}" class="icon-btn" style="float:right">×</button><h2 class="dialog-title">${v15T('handle')}</h2><p class="dialog-sub">${v15T('handleNote')}</p><form id="v15-handle-form"><div class="field"><label for="v15-handle-input">@</label><input id="v15-handle-input" name="handle" value="${E(db.studentHandles[session?.uid||'s1']||'')}" minlength="3" maxlength="24" pattern="[a-zA-Z0-9._]{3,24}" autocapitalize="none" spellcheck="false" autocomplete="off" required></div><p class="v15-handle-error" role="alert"></p><div class="dialog-foot"><button type="button" data-act="modal-close" class="button">${v15T('cancel')}</button><button type="submit" class="button primary">${v15T('save')}</button></div></form></div></div>`;
};
function v15RefreshResults(keepX){const prev=root.querySelector('.v15-plot-scroller')?.scrollLeft||0;render(false);const el=root.querySelector('.v15-plot-scroller');if(el&&keepX)el.scrollLeft=prev;}
root.addEventListener('click',e=>{
 const mode=e.target.closest('[data-v15-mode]'),shift=e.target.closest('[data-v15-shift]'),user=e.target.closest('[data-v15-person]'),clear=e.target.closest('[data-v15-clear]'),visit=e.target.closest('[data-v15-classstudent]'),edit=e.target.closest('[data-v15-edit-handle]');
 if(!(mode||shift||user||clear||visit||edit))return;e.preventDefault();e.stopImmediatePropagation();
 if(mode){v15Timeline.mode=mode.dataset.v15Mode;v15RefreshResults(false)}
 else if(shift){const n=Number(shift.dataset.v15Shift);if(v15Timeline.mode==='year')v15Timeline.year+=n;
  else{const d=new Date(v15Timeline.year,v15Timeline.month+n,1,12);v15Timeline.year=d.getFullYear();v15Timeline.month=d.getMonth()};v15RefreshResults(false);
 }else if(user){v15ActiveStudent=user.dataset.v15Person;v15SearchText='';v15RefreshResults(false)}
 else if(clear){v15ActiveStudent='';v15SearchText='';v15RefreshResults(false);root.querySelector('#v15-student-handle')?.focus({preventScroll:true})}
 else if(visit){selectedClass=visit.dataset.v15Classstudent;selectedStudent=visit.dataset.v15User;navigate('student-detail')}
 else if(edit){if(APP!=='student')return;openModal('v15-handle')}
},true);
root.addEventListener('change',e=>{
 const sel=e.target.closest?.('[data-v15-month-select]');if(!sel)return;e.stopImmediatePropagation();v15Timeline.month=Number(sel.value);v15RefreshResults(false);
},true);
root.addEventListener('input',e=>{
 const input=e.target;if(input?.id!=='v15-student-handle')return;
 v15SearchText=input.value;v15ActiveStudent='';const scope=input.closest('.v15-student-search')?.dataset.v15Scope||'';
 const list=input.closest('.v15-student-search')?.querySelector('.v15-people-suggestions');if(list)list.innerHTML=v15OptionMarkup(v15Matches(scope));
},true);
root.addEventListener('keydown',e=>{
 if(e.target?.id!=='v15-student-handle'||e.key!=='Enter')return;
 e.preventDefault();e.stopImmediatePropagation();const scope=e.target.closest('.v15-student-search')?.dataset.v15Scope||'',match=v15Matches(scope)[0];
 if(match){v15ActiveStudent=match.id;v15SearchText='';v15RefreshResults(false)}
},true);
root.addEventListener('submit',e=>{
 if(e.target.id!=='v15-handle-form')return;
 e.preventDefault();e.stopImmediatePropagation();
 const h=String(new FormData(e.target).get('handle')||'').trim().replace(/^@/,'').toLowerCase(),error=e.target.querySelector('.v15-handle-error');
 if(!/^[a-z0-9._]{3,24}$/.test(h)){error.textContent=v15T('invalid');return}
 const used=Object.entries(db.studentHandles||{}).some(([id,handle])=>id!==session?.uid&&handle===h);
 if(used){error.textContent=v15T('used');return}
 db.studentHandles[session.uid]=h;save();closeModal();notify('@'+h);
},true);


// V16 — visible horizontal chart controls (mouse, touch, keyboard).
const v16OldPlot = v15Plot;
v15Plot = function(entries){
 const html=v16OldPlot(entries);
 const en=uiLanguage==='en';
 const a=en?'Previous dates':'Datas anteriores',b=en?'Next dates':'Próximas datas';
 const controls=`<div class="v16-chart-controls" aria-label="${en?'Chart navigation':'Navegação do gráfico'}">
  <span class="v16-chart-hint">${en?'Navigate with buttons, mouse wheel or arrow keys.':'Use as setas, a roda do mouse ou as teclas ← →.'}</span>
  <span class="v16-chart-page" role="status" aria-live="off"></span>
  <div class="v16-chart-nav"><button type="button" data-v16-scroll="-1" aria-label="${a}" title="${a}">‹</button><button type="button" data-v16-scroll="1" aria-label="${b}" title="${b}">›</button></div>
 </div>`;
 const marker='<div class="v15-plot-scroller"';
 if(!html.includes(marker))return html;
 return html.replace(marker,controls+marker).replace('</svg></div><div class="v11-tooltip"','</svg></div><div class="v16-chart-track" aria-hidden="true"><span></span></div><div class="v11-tooltip"');
};
function v16UpdateChartControls(){
 const card=root.querySelector('.v15-chart-card'),scroll=card?.querySelector('.v15-plot-scroller');
 if(!scroll)return;
 const max=Math.max(0,scroll.scrollWidth-scroll.clientWidth),pos=Math.min(max,Math.max(0,scroll.scrollLeft));
 const controls=card.querySelector('.v16-chart-controls');
 if(!controls)return;
 const before=controls.querySelector('[data-v16-scroll="-1"]'),after=controls.querySelector('[data-v16-scroll="1"]');
 if(before)before.disabled=pos<=2;
 if(after)after.disabled=pos>=max-2;
 const total=v15Timeline.mode==='year'?12:new Date(v15Timeline.year,v15Timeline.month+1,0).getDate();
 const unit=scroll.scrollWidth/total;
 const start=Math.min(total,Math.max(1,Math.floor(pos/unit)+1));
 const end=Math.min(total,Math.max(start,Math.ceil((pos+scroll.clientWidth)/unit)));
 const label=controls.querySelector('.v16-chart-page');
 if(label)label.textContent=`${start}–${end} / ${total}`;
 const track=card.querySelector('.v16-chart-track > span');
 if(track){const pct=Math.min(100,scroll.clientWidth/scroll.scrollWidth*100);track.style.width=pct+'%';track.style.transform=`translateX(${pct<100?pos/scroll.scrollWidth*100/pct*100:0}%)`;}
}
// 'render' is also called when changing a filter, period, language and theme.
const v16OldRender=render;
render=function(...args){const result=v16OldRender(...args);requestAnimationFrame(v16UpdateChartControls);return result;};
root.addEventListener('click',e=>{
 const button=e.target.closest('[data-v16-scroll]');if(!button)return;
 e.preventDefault();e.stopImmediatePropagation();
 const scroller=root.querySelector('.v15-plot-scroller');if(!scroller)return;
 const step=Math.max(240,Math.round(scroller.clientWidth*.78));
 const dir=Number(button.dataset.v16Scroll);
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 scroller.scrollBy({left:dir*step,behavior:reduce?'instant':'smooth'});
},true);
root.addEventListener('scroll',e=>{if(e.target?.classList?.contains('v15-plot-scroller'))v16UpdateChartControls();},true);
root.addEventListener('keydown',e=>{
 if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
 const scroller=e.target?.closest?.('.v15-plot-scroller');if(!scroller)return;
 e.preventDefault();e.stopImmediatePropagation();
 scroller.scrollBy({left:(e.key==='ArrowLeft'?-1:1)*Math.max(190,scroller.clientWidth*.45),behavior:'smooth'});
},true);
// Horizontal mouse-wheel scrolling only when Shift is held, without swallowing normal page scroll.
root.addEventListener('wheel',e=>{
 const scroller=e.target?.closest?.('.v15-plot-scroller');if(!scroller||!e.shiftKey||scroller.scrollWidth<=scroller.clientWidth)return;
 if(e.cancelable)e.preventDefault();scroller.scrollLeft+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY);
},{passive:false});
window.addEventListener('resize',v16UpdateChartControls,{passive:true});
// Pages can enter after the exit transition finishes, so initialize newly inserted charts.
const v16ChartObserver=new MutationObserver(mutations=>{
 if(mutations.some(m=>Array.from(m.addedNodes).some(n=>n.nodeType===1 && (n.matches?.('.v15-chart-card, .v15-plot-scroller')||n.querySelector?.('.v15-plot-scroller'))))){requestAnimationFrame(v16UpdateChartControls)}
});
v16ChartObserver.observe(root,{childList:true,subtree:true});


auth();
})();
